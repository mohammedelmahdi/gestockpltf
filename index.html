<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<title>جملة الأحذية</title>

<style>
:root{--bg:#0b1220;--card:#141c2b;--card2:#1a2437;--line:#24304a;--ink:#e9eef6;--mut:#8b98ad;--acc:#f59e0b;--accd:#3a2e17;--ok:#34d399;--bad:#f87171;color-scheme:dark}

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 Tajawal,Tahoma,sans-serif}

.pb{display:flex;gap:8px;align-items:center}.pb select{flex:1}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}th{color:var(--mut);font-weight:700}.tw{overflow-x:auto}
input,select{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card2);color:var(--ink);width:100%}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:8px}
.btn{background:var(--card2);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer}
.btn.t{background:var(--acc);color:#1a1200;border-color:var(--acc)}.btn.s{padding:4px 10px;font-size:13px;border-radius:8px}
.tag{padding:2px 8px;border-radius:99px;font-size:12px;font-weight:700;background:var(--line)}
.tag.new{background:var(--accd);color:var(--acc)}.tag.shipped{background:#16294a;color:#7ab0ff}.tag.delivered{background:#12372b;color:var(--ok)}.tag.returned{background:#3d1d1d;color:var(--bad)}
#toast{position:fixed;bottom:16px;inset-inline:16px;max-width:420px;margin:auto;background:var(--acc);color:#1a1200;font-weight:700;padding:10px 14px;border-radius:12px;display:none;z-index:99}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}.pg .card{margin:0}
.pim{display:flex;gap:6px;margin-bottom:8px}.pim img{width:calc(50% - 3px);aspect-ratio:1;object-fit:cover;border-radius:12px;background:var(--card2)}
.login{max-width:340px;margin:12vh auto}.shop{max-width:560px;margin:0 auto;padding:14px}.mut{color:var(--mut)}h2,h3{margin:0 0 10px}

.tag.pending{background:#3b2a0a;color:#fbbf24}.tag.cancelled{background:var(--line);color:var(--mut)}
.ov{position:fixed;inset:0;background:#000b;z-index:90;display:grid;place-items:center;padding:14px}.ov .card{max-width:560px;width:100%;max-height:92vh;overflow:auto;margin:0}
.ims{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}.th1{position:relative;width:88px}.th1 img{width:88px;height:88px;object-fit:cover;border-radius:10px}
.th1 button{position:absolute;top:3px;inset-inline-end:3px;border:0;border-radius:6px;background:#000a;color:#fff;cursor:pointer}.th1 .cv{inset-inline-end:auto;inset-inline-start:3px;top:auto;bottom:3px;font-size:11px}.th1 em{font-size:11px;color:var(--acc)}
.dz{display:block;border:2px dashed var(--line);border-radius:12px;padding:14px;text-align:center;color:var(--mut);cursor:pointer;margin-bottom:8px}
.st{max-width:1000px;margin:0 auto;background:var(--card)}.an{background:var(--acc);color:#1a1200;text-align:center;padding:6px;font-weight:700;font-size:13px}
.sh{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}.bx{display:flex;align-items:center;gap:8px;font-size:18px}.bx img{height:36px;border-radius:8px}
.hero{background:linear-gradient(135deg,var(--acc),#1a1200) center/cover;color:#fff;text-align:center;padding:48px 16px}.hero h1{margin:0 0 6px;font-size:28px}.hero p{margin:0}
.pgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:16px}@media(min-width:760px){.pgrid{grid-template-columns:repeat(4,1fr)}}
.pc{border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;background:var(--card)}.pc>img{width:100%;aspect-ratio:1;object-fit:cover;background:var(--card2)}
.pi{padding:10px;display:flex;flex-direction:column;gap:4px}.pr{font-weight:800;font-size:17px;color:var(--acc)}.pi .btn{width:100%;margin-top:4px}
.pm .mi{width:100%;max-height:340px;object-fit:contain;border-radius:12px;background:var(--card2)}.th{display:flex;gap:6px;margin:8px 0}.th img{width:56px;height:56px;object-fit:cover;border-radius:8px;cursor:pointer}

.ct{position:fixed;bottom:18px;inset-inline-end:18px;background:var(--acc);color:#1a1200;border:0;border-radius:99px;padding:12px 18px;font:inherit;font-weight:800;cursor:pointer;z-index:50;box-shadow:0 4px 14px #0004}
.cl{display:flex;gap:10px;align-items:center;margin:8px 0}.cl img{width:56px;height:56px;object-fit:cover;border-radius:8px}.qs{display:flex;gap:8px;align-items:center}.qs button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--card2);color:var(--ink);cursor:pointer;font-size:18px}
#ld{display:none;position:fixed;inset:0;z-index:200;place-items:center;background:#0008}#ld.hard{display:grid}#ld.soft{display:grid;inset:70px 0 auto 0;background:none;pointer-events:none}
.lb{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:99px;padding:10px 18px;display:flex;gap:10px;align-items:center;font-weight:700;box-shadow:0 4px 14px #0005}
.sp{width:18px;height:18px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:rot .8s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
.ov .card.wide{max-width:920px}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.tag.confirmed{background:#2a1f4d;color:#b39cff}

body{overflow-x:hidden}.bd{display:none;position:fixed;inset:62px 0 0 0;background:#0008;z-index:25}aside.open+.bd{display:block}
.brand{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45vw}
.pg{grid-template-columns:repeat(auto-fill,minmax(min(270px,100%),1fr))}
@media(max-width:720px){
  input,select,textarea{font-size:16px}.top{padding:0 10px;gap:6px;padding-top:env(safe-area-inset-top)}.ib{width:40px;height:40px}
  main{padding:10px}.card{padding:12px;border-radius:14px}.row{grid-template-columns:1fr 1fr}.row>input[type=file],.row>input:only-child{grid-column:1/-1}
  .kc .b{padding:10px;gap:8px}.kc strong{font-size:17px}.kc .i{width:40px;height:40px}.kc .f{padding:6px 10px;font-size:12px}
  .btn{min-height:40px}.btn.s{min-height:34px;padding:4px 10px}
  .ov{place-items:end center;padding:0}.ov .card,.ov .card.wide{max-width:100%;width:100%;max-height:92vh;border-radius:18px 18px 0 0;padding-bottom:calc(14px + env(safe-area-inset-bottom))}
  .pb{flex-wrap:wrap}.pb input,.pb select{min-width:0}
  .pgrid{gap:8px;padding:10px}.hero{padding:30px 12px}.hero h1{font-size:22px}.pi{padding:8px}.pm .mi{max-height:260px}
  .ct,.wa{bottom:calc(14px + env(safe-area-inset-bottom))}.th1,.th1 img{width:76px;height:76px}.th1 img{height:76px}
}
@media(max-width:1000px){
  .tw{overflow:visible}table.rt{display:block}table.rt tbody{display:block}table.rt tr.hd{display:none}
  table.rt tr{display:block;background:var(--card2);border:1px solid var(--line);border-radius:12px;margin:8px 0;padding:6px 12px}
  table.rt td{display:flex;justify-content:space-between;gap:12px;border:0;padding:5px 0;text-align:end!important;white-space:normal!important;border-bottom:1px dashed var(--line)}
  table.rt td:last-child{border-bottom:0}table.rt td::before{content:attr(data-l);color:var(--mut);font-weight:700;flex:none;text-align:start}
  table.rt td[data-l='']::before{display:none}table.rt td:empty{display:none}
  table.rt td{flex-wrap:wrap}table.rt td:last-child{justify-content:flex-start}table.rt td .btn{margin:2px;max-width:100%}
}
@media(min-width:721px) and (max-width:900px){main{padding:14px}}
.noimg{display:grid;place-items:center;width:100%;aspect-ratio:1;font-size:44px;background:var(--card2);border-radius:12px}.pc .noimg{border-radius:0}
@media(max-width:720px){#toast{bottom:auto;top:calc(70px + env(safe-area-inset-top))}}
.rk{border:0;border-radius:99px;padding:3px 10px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;margin-top:4px}.rk.pos{background:#12372b;color:var(--ok)}.rk.wrn{background:#3b2a0a;color:#fbbf24}.rk.neg{background:#3d1d1d;color:var(--bad)}.wrn{color:#fbbf24}
.tag{white-space:nowrap;flex:none}.pb{flex-wrap:wrap}.pb input{flex:2 1 220px}.pb select{flex:1 1 150px;width:auto}
.stsel{width:auto;min-width:200px;max-width:100%;padding:6px 10px;border-radius:99px;font-weight:700;font-size:13px;border:0}.stsel:disabled{opacity:1;-webkit-text-fill-color:currentColor}
.stsel.st-new{background:var(--accd);color:var(--acc)}.stsel.st-confirmed{background:#2a1f4d;color:#b39cff}.stsel.st-pending{background:#3b2a0a;color:#fbbf24}.stsel.st-shipped{background:#16294a;color:#7ab0ff}
.stsel.st-delivered{background:#12372b;color:var(--ok)}.stsel.st-returned{background:#3d1d1d;color:var(--bad)}.stsel.st-cancelled{background:var(--line);color:var(--mut)}
/* علامة "Powered by Netlify" تتزاد من نتليفاي فوق الصفحة: نخلي كل الأزرار فوقها */
body{padding-bottom:90px}.ct,.wa{bottom:96px}
@media(max-width:720px){.ov .card,.ov .card.wide{padding-bottom:calc(104px + env(safe-area-inset-bottom))}.ct,.wa{bottom:calc(96px + env(safe-area-inset-bottom))}}
</style>

<body>
<div id="app"></div><div id="toast"></div><div id="ld"><div class="lb"><span class="sp"></span><b>جاري المعالجة…</b></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="config.js"></script>
<script>
const API_URL = window.API_URL || ''; // من config.js
const $ = s => document.querySelector(s), app = $('#app');
const ST = {new:'جديد (بانتظار تأكيد البائع)', confirmed:'مؤكد — جاهز للتحضير', shipped:'تبعث', delivered:'تسلّم', returned:'رجع', pending:'في Noest (غير مؤكد)', cancelled:'ملغى'};
const W = "Adrar,Chlef,Laghouat,Oum El Bouaghi,Batna,Béjaïa,Biskra,Béchar,Blida,Bouira,Tamanrasset,Tébessa,Tlemcen,Tiaret,Tizi Ouzou,Alger,Djelfa,Jijel,Sétif,Saïda,Skikda,Sidi Bel Abbès,Annaba,Guelma,Constantine,Médéa,Mostaganem,M'Sila,Mascara,Ouargla,Oran,El Bayadh,Illizi,Bordj Bou Arréridj,Boumerdès,El Tarf,Tindouf,Tissemsilt,El Oued,Khenchela,Souk Ahras,Tipaza,Mila,Aïn Defla,Naâma,Aïn Témouchent,Ghardaïa,Relizane,Timimoun,Bordj Badji Mokhtar,Ouled Djellal,Béni Abbès,In Salah,In Guezzam,Touggourt,Djanet,El M'Ghair,El Meniaa".split(',');
const wOpts = () => '<option value="">الولاية</option>' + W.map((n, i) => `<option value="${i + 1}">${i + 1} - ${n}</option>`).join('');
let I = [];
let CART = [];
const saveCart = () => { try { localStorage['cart_' + slug] = JSON.stringify(CART); } catch (e) {} };
const cartBadge = () => { const b = $('#cb'); if (b) b.textContent = CART.reduce((s, l) => s + l.qty, 0); };
async function upd() {
  const sub = CART.reduce((s, l) => s + l.price * l.qty, 0), parcels = CART.reduce((s, l) => s + l.qty, 0);
  const fee = val('w') ? (await api('quote', {slug, wilaya: val('w'), stopDesk: val('dm')})).fee : 0;
  $('#tot').innerHTML = `المنتجات: ${num(sub)} دج<br>التوصيل (${parcels} طرد × ${num(fee)}): ${val('w') ? num(fee * parcels) + ' دج' : 'اختار الولاية'}<br><b>المجموع عند الاستلام: ${num(sub + fee * parcels)} دج</b>`;
}
function mobLabels() {            // يضيف عنوان العمود لكل خانة باش الجدول يتحول لبطاقات في الهاتف
  document.querySelectorAll('.tw table').forEach(t => {
    t.classList.add('rt'); const rows = [...t.rows], hr = rows.find(r => r.querySelector('th')); if (!hr) return;
    hr.classList.add('hd'); const hs = [...hr.cells].map(c => c.textContent.trim());
    rows.forEach(r => { if (r !== hr) [...r.cells].forEach((c, i) => { if (c.dataset.l === undefined) c.dataset.l = hs[i] || ''; }); });
  });
}
if (document.body) new MutationObserver(mobLabels).observe(document.body, {childList: true, subtree: true});
let GS = '';
const imL = p => { try { return JSON.parse(p.images || '[]'); } catch (e) { return []; } };
async function geo(w, c, d, s) {
  if (slug) upd();
  const cs = $('#' + c), ss = $('#' + s), sd = val(d) === '1';
  cs.innerHTML = '<option value="">البلدية</option>'; ss.innerHTML = '<option value="">المكتب</option>';
  cs.style.display = sd ? 'none' : ''; ss.style.display = sd ? '' : 'none';
  if (!val(w)) return;
  const x = {slug: GS || slug || S.slug, wilaya: val(w)};
  if (sd) { const r = await api('stations', x); ss.innerHTML += r.list.map(n => `<option value="${esc(n.code)}">${esc(n.name)} — ${esc(n.address)}</option>`).join(''); }
  else { const r = await api('communes', x); cs.innerHTML += r.list.map(n => `<option>${esc(n)}</option>`).join(''); }
}
function cp(id) {
  const a = +val('a' + id), w = +val('w' + id), b = +val('b' + id), m = Math.round(a * (w - b) * 100) / 100;
  $('#cp' + id).textContent = num(Math.round(a * w * 100) / 100); $('#mg' + id).textContent = b ? num(m) : '—'; $('#mg' + id).className = pn(b ? m : 0);
}
function saveP(id) {
  const g = k => val(k + id);
  act('saveProduct', {id: id === 'new' ? '' : id, name: g('n'), pairs: g('a'), wholesale: Math.round(g('a') * g('w') * 100) / 100, buy: Math.round(g('a') * g('b') * 100) / 100, stock: g('s'), weight: g('k'), desc: g('d'), images: $('#im' + id).dataset.u});
}
const imHtml = (id, a) => a.map((u, i) => `<div class="th1"><img src="${esc(u)}"><button onclick="rmIm('${id}',${i})">✕</button>${i ? `<button class="cv" onclick="coverIm('${id}',${i})">★ غلاف</button>` : '<em>الغلاف</em>'}</div>`).join('');
const imSet = (id, f) => { const el = $('#im' + id), a = JSON.parse(el.dataset.u || '[]'); f(a); el.dataset.u = JSON.stringify(a); el.innerHTML = imHtml(id, a); };
const rmIm = (id, i) => imSet(id, a => a.splice(i, 1));
const coverIm = (id, i) => imSet(id, a => a.unshift(a.splice(i, 1)[0]));
async function upl(f) {
  const im = await new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = URL.createObjectURL(f); });
  const c = document.createElement('canvas'), k = Math.min(1, 900 / Math.max(im.width, im.height)); c.width = im.width * k; c.height = im.height * k;
  c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
  return (await api('uploadImg', {data: c.toDataURL('image/jpeg', 0.82).split(',')[1]})).url;
}
async function pick(inp, id) {
  toast('كنرفع الصور…');
  for (const f of inp.files) { if (JSON.parse($('#im' + id).dataset.u || '[]').length >= 5) break; const u = await upl(f); imSet(id, a => a.push(u)); }
  toast('تم ✔ — ما تنساش تضغط حفظ');
}
function scanBox() {
  return `<div class="card"><h3>سكان بوردرو المرتجع</h3><div class="row"><input id="sc" placeholder="امسح الباركود ولا اكتب رقم التتبع" onkeydown="if(event.key==='Enter')scan()"><button class="btn t" onclick="scan()">استقبال</button><button class="btn" onclick="camScan()">كاميرا</button></div><div id="cam"></div></div>`;
}
async function scan() {
  const code = val('sc').trim(); if (!code) return;
  const r = await api('scanReturn', {code}); await dash();
  popup('رجع للمخزون ✔', `كرطون البائع <b>${esc(r.seller)}</b><br>${esc(r.items)}<br>تم إنقاص <b>${num(r.value)} دج</b> من دينو عند المورد.`); setTimeout(() => $('#sc') && $('#sc').focus(), 50);
}
async function camScan() {
  if (!('BarcodeDetector' in window)) return toast('هذا المتصفح ما يدعمش سكان الكاميرا، استعمل قارئ باركود ولا اكتب الرقم');
  const v = document.createElement('video'); v.setAttribute('playsinline', ''); v.style.cssText = 'width:100%;border-radius:8px'; $('#cam').appendChild(v);
  const st = await navigator.mediaDevices.getUserMedia({video: {facingMode: 'environment'}}); v.srcObject = st; await v.play();
  const bd = new BarcodeDetector();
  (async function loop() {
    const r = await bd.detect(v).catch(() => []);
    if (r.length) { st.getTracks().forEach(t => t.stop()); v.remove(); $('#sc').value = r[0].rawValue; scan(); }
    else if (v.isConnected) requestAnimationFrame(loop);
  })();
}
async function label(id) {
  const r = await api('label', {orderId: id}), o = D.orders.find(x => x.id === id);
  let out = Uint8Array.from(atob(r.pdf), c => c.charCodeAt(0));
  if (+o.qty > 1 && window.PDFLib) {                       // نسخة لكل كرطون + ترقيم 1/2 و 2/2
    const {PDFDocument, StandardFonts} = PDFLib, src = await PDFDocument.load(out), doc = await PDFDocument.create(), f = await doc.embedFont(StandardFonts.HelveticaBold);
    for (let i = 1; i <= +o.qty; i++) { const [pg] = await doc.copyPages(src, [0]); doc.addPage(pg); pg.drawText(i + '/' + o.qty, {x: 8, y: pg.getHeight() - 22, size: 16, font: f}); }
    out = await doc.save();
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([out], {type: 'application/pdf'})); a.download = r.name; a.click();
}
let S = JSON.parse(sessionStorage.me || 'null'), D = {}, tab = '';

function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',3500)}
const BZ = [0, 0];
function busy(k, d) { BZ[k] += d; const l = $('#ld'); if (l) l.className = BZ[1] > 0 ? 'hard' : BZ[0] > 0 ? 'soft' : ''; }

function stats(os, ex, rt, plan) {

  const ret = os.filter(o => o.status === 'returned'), dN = os.filter(o => o.status === 'delivered').length;
  const months = new Set(sent.map(o => new Date(o.date).toISOString().slice(0, 7))).size;
  const rf = plan === 'sub' ? months * SUB_FEE : ret.reduce((s, o) => s + +(o.retFee || 0), 0);
  const sales = v(sent) - v(back), cost = c(sent) - c(back), exp = ex.reduce((s, e) => s + +e.amount, 0), op = os.filter(o => ['new', 'confirmed', 'pending'].includes(o.status)), pf = a => a.reduce((s, o) => s + (o.price - o.wholesale) * o.qty, 0), dl = os.filter(o => o.status === 'delivered'), sh = os.filter(o => o.status === 'shipped');

    profit: pf(dl) - exp - rf, open: v(op), eprofit: pf(dl) + pf(sh) - exp - rf, dN, rN: ret.length, rr: dN + ret.length ? Math.round(ret.length / (dN + ret.length) * 100) : 0};
}

    const ids = D.sellers.map(s => s.id), x = sel(ids, null), R = D.sellers.map(s => ledger(s.id)), T = f => R.reduce((t, l) => t + f(l), 0);
    const exp = D.expenses.reduce((s, e) => s + +e.amount, 0), gp = T(l => l.profit), net = gp - exp;
    return kcards([['الطلبات', num(x.n), 'cart', 'كل البائعين'], ['تم التسليم', num(x.dN), 'check', 'طرود'], ['راجعة', num(x.rN), 'undo', 'طرود'], ['في الانتظار', num(x.wait), 'clock', 'جديد + مؤكد + في الطريق'], ['نسبة الإرجاع', x.rr + '%', 'filter', ''],
      ['مبيعاتك للبائعين', num(T(l => l.net)) + ' دج', 'box', 'بعد خصم الملغى والمعاد'], ['تكلفة شرائك', num(T(l => l.net - l.profit)) + ' دج', 'wallet', ''], ['الربح الإجمالي', num(gp) + ' دج', 'trend', 'مبيعاتك − تكلفة شرائك', gp],
      ['مصاريفك', num(exp) + ' دج', 'wallet', 'من تبويب «مصاريفي»'], ['الربح الصافي', num(net) + ' دج', 'trend', 'الربح الإجمالي − مصاريفك', net], ['المحصّل من البائعين', num(T(l => l.paid)) + ' دج', 'cash', ''], ['ديون البائعين', num(T(l => l.debt)) + ' دج', 'wallet', 'متبقي لك']]);
  },
  team() {
    return `<div class="card"><h3>عمال إدخال الطلبات</h3><p class="mut">العامل يشوف صفحة طلباتك فقط: يدخل الطلبات ويؤكدها ويعدلها. ما يشوفش الأرباح ولا الحساب مع المورد ولا إعدادات Noest.</p>
    <div class="row"><input id="al" placeholder="اسم الدخول (إنجليزي، مثلا ahmed1)"><input id="an" placeholder="الاسم"><input id="ap" placeholder="كلمة السر (4 أحرف+)"></div><button class="btn t" onclick="act('saveAgent',{login:val('al'),name:val('an'),pass:val('ap')})">زيد عامل</button></div>
    <div class="card tw"><table><tr><th>اسم الدخول</th><th>الاسم</th><th>كلمة السر</th><th></th></tr>${(D.agents || []).map(a => `<tr><td>${esc(a.id)}</td><td><input id="an${a.id}" value="${esc(a.name)}"></td><td><input id="ap${a.id}" value="${esc(a.pass)}"></td><td><button class="btn s" onclick="act('saveAgent',{id:'${a.id}',name:val('an${a.id}'),pass:val('ap${a.id}')})">حفظ</button> <button class="btn s" onclick="delAgent('${a.id}')">حذف</button></td></tr>`).join('') || '<tr><td colspan=4 class="mut">ما كاين عمال بعد.</td></tr>'}</table></div>`;
  },
  noest() {
    return `<div class="card"><h3>ربط حساب Noest Express</h3><p class="mut">${D.noest.set ? 'مربوط ✔ (GUID: ' + D.noest.mask + ')' : 'ما ربطتش حسابك بعد.'}</p>
    <div class="row"><input id="nt" type="password" placeholder="API token"><input id="ng" placeholder="User GUID"></div>
    <button class="btn t" onclick="act('saveNoest',{token:val('nt'),guid:val('ng')})">اختبر واحفظ</button>
    <p class="mut">الباكند يتأكد من الحساب ملي تحفظ. التوكن ما يرجعش للمتصفح، والطرود تتبعث من حسابك انت.</p></div>`;
  },
  stats() {
    return view([S.id]) + `<div class="card"><h3>حقوق الاسترجاع</h3><select id="pl" onchange="act('setPlan',{plan:val('pl')})"><option value="per" ${D.plan === 'per' ? 'selected' : ''}>على كل طرد راجع (حسب سعر Noest)</option><option value="sub" ${D.plan === 'sub' ? 'selected' : ''}>اشتراك ${num(SUB_FEE)} دج في الشهر</option></select>
    <p class="mut"><b>الربح</b> = ربح الطرود المسلّمة − كل المصاريف (المصاريف المسجلة + حقوق الاسترجاع).<br><b>الربح المتوقع</b> = ربح الطرود المسلّمة + ربح الطرود المبعوثة (في الطريق) − نفس المصاريف.<br>ربح الطرد = (سعر بيعك − سعر الجملة) × عدد الكراطن. الطلبات الجديدة وغير المؤكدة في «قيد المعالجة».</p></div>`;
  },
  exp() {
    return `<div class="card"><h3>مصروف جديد</h3><div class="row"><input id="el" placeholder="الوصف (إعلانات، نقل…)"><input id="ea" type="number" placeholder="المبلغ دج"></div><button class="btn" onclick="act('addExpense',{label:val('el'),amount:val('ea')})">زيد</button></div>
    <div class="card tw"><table><tr><th>التاريخ</th><th>الوصف</th><th>المبلغ</th><th></th></tr>${D.expenses.slice().reverse().map(e => `<tr><td>${fd(e.date)}</td><td>${esc(e.label)}</td><td>${num(e.amount)}</td><td><button class="btn s" onclick="delExp('${e.id}')">حذف</button></td></tr>`).join('')}</table></div>`;
  },
  stock() {
    const pairP = p => p.pairs ? Math.round(p.wholesale / p.pairs * 100) / 100 : 0;
    if (S.role === 'admin') {
      const form = (p, id) => `<div class="card"><div id="im${id}" class="ims" data-u="${esc(JSON.stringify(imL(p)))}">${imHtml(id, imL(p))}</div>
      <label class="dz" ondragover="event.preventDefault()" ondrop="event.preventDefault();pick({files:event.dataTransfer.files},'${id}')">＋ أضف صور (اسحبها هنا ولا اضغط — حتى 5)<input type="file" multiple accept="image/*" hidden onchange="pick(this,'${id}')"></label>
      <div class="row"><input id="n${id}" placeholder="الاسم/الموديل" value="${esc(p.name || '')}"><input id="a${id}" type="number" placeholder="أزواج في الكرطون" value="${p.pairs || ''}" oninput="cp('${id}')"><input id="w${id}" type="number" step="0.01" placeholder="سعر بيعك للبائعين للزوج" value="${p.pairs ? pairP(p) : ''}" oninput="cp('${id}')"></div>
      <div class="row"><input id="b${id}" type="number" step="0.01" placeholder="سعر شرائك للزوج (تكلفتك)" value="${p.pairs && p.buy ? Math.round(p.buy / p.pairs * 100) / 100 : ''}" oninput="cp('${id}')"></div>
      <div class="row"><input id="s${id}" type="number" placeholder="الستوك (كراطن)" value="${p.stock ?? ''}"><input id="k${id}" type="number" step="0.1" placeholder="وزن الكرطون كغ" value="${p.weight || ''}"></div>
      <div class="row"><input id="d${id}" placeholder="وصف قصير (المقاسات، الألوان…)" value="${esc(p.desc || '')}"></div>
      <p>سعر الكرطون للبائع = <b id="cp${id}">${num(p.wholesale)}</b> دج — ربحك في الكرطون: <b id="mg${id}" class="${pn(p.wholesale - p.buy)}">${p.buy ? num(p.wholesale - p.buy) : '—'}</b> دج</p><button class="btn t" onclick="saveP('${id}')">${p.id ? 'حفظ' : 'زيد المنتج'}</button> ${p.id ? `<button class="btn s" onclick="act('toggleProduct',{id:'${p.id}',hidden:${p.hidden ? 0 : 1}})">${p.hidden ? '👁 أظهره للبائعين' : '🙈 أخفه عن البائعين'}</button>${p.hidden ? ' <span class="tag cancelled">مخفي عن البائعين</span>' : ''}` : ''}</div>`;
      return `<div class="pg">${D.products.map(p => form(p, p.id)).join('')}${form({}, 'new')}</div>`;
    }
    return `<div class="pg">${D.products.map(p => { const pr = D.prices.find(x => x.productId === p.id), sp = pr && p.pairs ? Math.round(pr.price / p.pairs * 100) / 100 : '';
      return `<div class="card"><div class="pim">${imL(p).slice(0, 2).map(imgTag).join('')}</div><b>${esc(p.name)}</b><p class="mut">${p.pairs} زوج في الكرطون — متوفر ${p.stock} كرطون<br>سعر الجملة: ${num(pairP(p))} للزوج = <b>${num(p.wholesale)}</b> للكرطون</p>
      <div class="row"><input id="pr${p.id}" type="number" step="0.01" placeholder="سعر بيعك للزوج" value="${sp}" oninput="$('#sp${p.id}').textContent=num(Math.round(val('pr${p.id}')*${p.pairs}*100)/100)"></div>
      <p>سعر الكرطون للزبون: <b id="sp${p.id}">${pr ? num(pr.price) : 0}</b> دج</p><button class="btn t s" onclick="act('setPrice',{productId:'${p.id}',price:Math.round(val('pr${p.id}')*${p.pairs}*100)/100})">حفظ</button> ${pr ? `<button class="btn s" onclick="act('setVisible',{productId:'${p.id}',hidden:${pr.hidden ? 0 : 1}})">${pr.hidden ? '👁 أظهره في متجري' : '🙈 أخفه من متجري'}</button>${pr.hidden ? ' <span class="tag cancelled">مخفي من متجري</span>' : ''}` : ''}</div>`; }).join('')}</div>`;
  },
  ret() {
    return scanBox() + `<div class="card tw"><table><tr><th>التاريخ</th><th>البائع</th><th>المنتج</th><th>كراطن</th><th></th></tr>${D.returns.slice().reverse().map(r => `<tr><td>${fd(r.date)}</td><td>${esc(sname(r.seller))}</td><td>${esc((D.orders.find(o => o.id === r.orderId) || {}).productName || pname(r.productId))}</td><td>${r.qty}</td>
    <td>${r.received === 'yes' ? '<span class="tag delivered">استُقبل</span>' : `<button class="btn t s" onclick="act('receiveReturn',{id:'${r.id}'})">استقبلت في المخزن</button>`}</td></tr>`).join('') || '<tr><td colspan=5 class="mut">ما كاين مرتجعات.</td></tr>'}</table></div>`;
  },
  sellers() {
    const R = D.sellers.map(s => ({s, l: ledger(s.id), rr: sel([s.id], null).rr})), T = f => R.reduce((t, x) => t + f(x.l), 0);
    return kcards([['مبيعاتك للبائعين', num(T(l => l.net)) + ' دج', 'box', 'بعد خصم الملغى والمعاد'], ['تكلفة شرائك', num(T(l => l.net - l.profit)) + ' دج', 'wallet', ''],
      ['ربحك', num(T(l => l.profit)) + ' دج', 'trend', 'مبيعاتك − تكلفة شرائك', T(l => l.profit)], ['المحصّل (دفعات)', num(T(l => l.paid)) + ' دج', 'cash', ''], ['ديون عند البائعين', num(T(l => l.debt)) + ' دج', 'wallet', 'متبقي لك']])
    + `<div class="card tw"><h3>حسابات البائعين</h3><table><tr><th>البائع</th><th>بضاعة مسجلة</th><th>ملغى قبل البعث</th><th>معادة بعد الإرسال</th><th>تكلفة شرائك</th><th>ربحك</th><th>دفعات</th><th>الدين</th><th>إرجاع</th><th></th></tr>${R.map(({s, l, rr}) => `<tr><td>${esc(s.name)}</td><td>${num(l.taken)}<br><small class="mut">${l.takenQ} كرطون</small></td><td>${num(l.canc)}<br><small class="mut">${l.cancQ} كرطون</small></td><td>${num(l.back)}<br><small class="mut">${l.backQ} كرطون</small></td><td>${num(l.net - l.profit)}</td><td><b class="${pn(l.profit)}">${num(l.profit)}</b></td><td>${num(l.paid)}</td><td><b>${num(l.debt)}</b></td><td>${rr}%</td><td><button class="btn t s" onclick="stmt('${s.id}')">كشف / دفعة</button></td></tr>`).join('')}</table></div>`;
  },
  users() {
    const R = {admin: 'أدمين', warehouse: 'عامل مخزن', seller: 'بائع', agent: 'عامل بائع'}, so = v => `<option value="">— البائع التابع له —</option>${D.sellers.map(s => `<option value="${s.id}" ${v === s.id ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}`;
    return `<div class="card tw"><table><tr><th>المعرّف</th><th>الاسم</th><th>الدور</th><th>كلمة السر</th><th>slug المتجر</th><th>تابع للبائع (للعامل)</th><th></th></tr>${D.users.map(u => `<tr><td><small>${u.id}</small></td><td><input id="un${u.id}" value="${esc(u.name)}"></td>
    <td><select id="ur${u.id}">${Object.keys(R).map(k => `<option value="${k}" ${u.role === k ? 'selected' : ''}>${R[k]}</option>`).join('')}</select></td><td><input id="up${u.id}" value="${esc(u.pass)}"></td><td><input id="us${u.id}" value="${esc(u.slug)}"></td><td><select id="uq${u.id}">${so(u.parent)}</select></td>
    <td><button class="btn s" onclick="act('saveUser',{id:'${u.id}',name:val('un${u.id}'),role:val('ur${u.id}'),pass:val('up${u.id}'),slug:val('us${u.id}'),parent:val('uq${u.id}')})">حفظ</button></td></tr>`).join('')}</table></div>
    <div class="card"><h3>مستخدم جديد</h3><div class="row"><input id="xn" placeholder="الاسم"><select id="xr"><option value="seller">بائع</option><option value="warehouse">عامل مخزن</option><option value="agent">عامل بائع</option><option value="admin">أدمين</option></select><input id="xp" placeholder="كلمة السر"><input id="xs" placeholder="slug (للبائع) مثلا ahmed"><select id="xq">${so('')}</select></div>
    <button class="btn" onclick="act('saveUser',{name:val('xn'),role:val('xr'),pass:val('xp'),slug:val('xs'),parent:val('xq')})">زيد</button></div>`;
  }
};
</script>
</body>
</html>
